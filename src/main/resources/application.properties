server.port=8090
server.servlet.context-path=/contractTesting

spring.application.name=fs-contractTesting-svc

# MongoDB — shared Probestack cluster
#spring.data.mongodb.uri = mongodb://localhost:27017/projectdb-project

spring.data.mongodb.uri==${mongodb_uri_forgestudio:mongodb+srv://forgestudio_db_user:7JIKZv2VsG013aNk@probestack-forgestudio.3p6eob8.mongodb.net/probestack-forgestudio?appName=probestack-forgestudio}
spring.data.mongodb.database=probestack-forgestudio

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# File upload limit for spec files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# External microservice URLs
services.project.base-url=${PROJECT_SERVICE_URL:http://localhost:8081}
services.project.context-path=/api/v1/projects

services.apispec.base-url=${APISPEC_SERVICE_URL:http://localhost:8082}
services.apispec.context-path=/api/v1/specs

# Mock server runtime base URL
mock.service.base-url=https://forgestudio.probestack.io/contractTesting/mock

# Actuator — expose health and info probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.forge.contracttesting=DEBUG

